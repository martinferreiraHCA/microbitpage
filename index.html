<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>micro:bit Panel Lab — paneles de monitoreo con bloques</title>
  <meta name="description" content="Plataforma educativa: recibe datos del micro:bit por serial, arma un panel de monitoreo a tu gusto y programa la lógica con bloques estilo Scratch. Cámara, Teachable Machine, alertas y proyectos descargables.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/blockly/blockly.min.js"></script>
  <script src="vendor/blockly/es.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">🧩 <span>micro:bit <b>Panel Lab</b></span></div>
    <input id="project-name" title="Nombre del proyecto" value="Mi panel micro:bit">
    <div class="tb-group center">
      <button id="btn-connect" class="btn primary" data-connect><span class="dot" data-status-dot></span> Conectar micro:bit</button>
      <button class="btn run" data-run>▶ Ejecutar</button>
    </div>
    <div class="tb-group right">
      <div class="menu"><button id="btn-project" class="btn ghost">Proyecto ▾</button>
        <div class="menu-list">
          <button id="m-new">Nuevo proyecto</button>
          <button id="m-download">Descargar archivo (.json)</button>
          <button id="m-upload">Abrir archivo…</button>
          <button id="m-share">Copiar enlace con el proyecto</button>
          <div class="menu-title">Ejemplos</div>
          <div id="examples-menu"></div>
        </div>
      </div>
      <div class="menu"><button id="btn-tools" class="btn ghost">Herramientas ▾</button>
        <div class="menu-list">
          <button id="btn-microbit-code">Código para el micro:bit</button>
          <button id="btn-data">Datos serial y simulador</button>
          <button data-sim>Simulador de datos <small>Genera valores de prueba sin micro:bit</small></button>
          <button id="btn-ml-help">Cómo conectar ML - micro:bit <small>IA → Bluetooth → micro:bit → serial → panel</small></button>
          <button id="btn-embed">Embeber en otra página</button>
          <button id="m-clear-vars">Borrar datos recibidos</button>
        </div>
      </div>
      <button id="btn-ml" class="btn ghost" title="Entrenar un modelo de IA con ML - micro:bit">IA · ML micro:bit</button>
      <button id="btn-panel-mode" class="btn ghost" title="Ver solo el panel">Ver panel</button>
      <button class="btn ghost" data-fullscreen title="Pantalla completa">⛶</button>
      <button id="btn-guide" class="btn accent">Guía</button>
    </div>
  </header>

  <nav id="mobile-tabs"><button data-tab="blocks">Bloques</button><button data-tab="panel" class="active">Panel</button></nav>

  <main id="main">
    <section id="blocks-pane">
      <div class="pane-head"><span>Bloques</span><span class="muted">Empezá con un evento amarillo</span></div>
      <div id="blockly"></div>
    </section>
    <div id="splitter" title="Arrastrá para cambiar el tamaño"></div>
    <section id="dash-pane">
      <div class="pane-head" id="dash-toolbar">
        <span>Panel</span>
        <div class="menu"><button id="add-btn" class="btn primary" title="Agregar un elemento al panel">+ Agregar elemento</button><div class="menu-list add-grid" id="add-menu"></div></div>
        <button id="btn-bg" class="btn ghost">Fondo</button>
        <button id="btn-arrow" class="btn ghost" title="Agregar una flecha o línea para marcar un lugar">➚ Flecha</button>
        <button id="btn-props" class="btn ghost">Propiedades</button>
        <button id="btn-lock" class="btn ghost" title="Bloquear el panel para usarlo sin mover nada">🔓 Edición</button>
      </div>
      <div id="dash-viewport" class="edit"><div class="dash-canvas"></div></div>
      <div id="panel-bar">
        <button class="btn" data-connect><span class="dot" data-status-dot></span> Conectar micro:bit</button>
        <button class="btn run" data-run>▶ Ejecutar</button>
        <button class="btn" data-fullscreen>⛶</button>
        <button class="btn exit" data-exit-panel>Editar</button>
      </div>
      <div id="ml-win" class="ml-win" hidden>
        <div class="ml-head">
          <span class="ml-title">ML - micro:bit</span>
          <span class="ml-hint">entrená un modelo y conectalo al micro:bit por Bluetooth · la detección sigue activa mientras esta ventana esté abierta</span>
          <span class="ml-spacer"></span>
          <button class="mini" id="btn-ml-help2" title="Cómo llega al panel">¿Cómo llega al panel?</button>
          <a class="mini" href="ml/index.html" target="_blank" rel="noopener" title="Abrir en pestaña nueva">↗</a>
          <button class="mini" data-ml-size="mini" title="Ventana chica (miniatura de la cámara)">▁</button>
          <button class="mini" data-ml-size="normal" title="Ventana flotante sobre el panel">▢</button>
          <button class="mini" data-ml-size="max" title="Pantalla completa dentro de la plataforma">⛶</button>
          <button class="mini danger" data-ml-close title="Cerrar ML - micro:bit (detiene la detección)">✕</button>
        </div>
        <iframe id="ml-frame" title="ML - micro:bit" allow="camera; microphone; bluetooth; serial; fullscreen"></iframe>
      </div>
    </section>
    <aside id="props" class="drawer"></aside>
    <aside id="guide" class="drawer"></aside>
  </main>

  <footer id="statusbar">
    <span>Serial: <code id="st-line">esperando datos…</code> <small id="st-src"></small></span>
    <span id="st-vars">0 variables</span>
    <span id="st-sim" class="pill" hidden>Simulador activo</span>
    <span id="st-warn" class="warn"></span>
    <span class="right muted"><a href="https://github.com/martinferreiraHCA/microbitpage" target="_blank" rel="noopener">Código fuente</a></span>
  </footer>

  <div id="toasts"></div>
  <dialog id="dlg"></dialog>
  <datalist id="var-names"></datalist>

  <script src="js/state.js"></script>
  <script src="js/serial.js"></script>
  <script src="js/tm.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/project.js"></script>
  <script src="js/microbit-code.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
